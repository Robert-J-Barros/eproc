services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eproc}
      MYSQL_USER: ${MYSQL_USER:-eproc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Publica a porta do container na sua máquina -- acessível via
      # localhost:3306 (ou 127.0.0.1:3306) com qualquer client externo
      # (DBeaver, MySQL Workbench, etc.). Se já tiver outro MySQL local
      # usando a porta 3306, troque o lado esquerdo (ex.: "3308:3306").
      - "3306:3306"
    networks:
      - eproc_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  eproc-automation:
    build: .
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Screenshots de erro (erro_timeout.png / erro_geral.png) ficam
      # acessíveis fora do container, na pasta ./output
      - ./output:/app/output
      # Coloque aqui a imagem do QR code (ex.: qrcodes/qrcode.png) para
      # o decode_qr.py conseguir ler de dentro do container
      - ./qrcodes:/app/qrcodes
    networks:
      - eproc_net
    # Mantém o container rodando (ver CMD no Dockerfile) para permitir
    # `docker compose exec` e rodar os scripts manualmente
    stdin_open: true
    tty: true
    # IPC compartilhado evita problemas de memória do Chromium em
    # alguns hosts Docker (recomendação oficial do Playwright)
    ipc: host

networks:
  eproc_net:
    driver: bridge

volumes:
  mysql_data: