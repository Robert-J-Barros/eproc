services:
  eproc-automation:
    build: .
    env_file:
      - .env
    volumes:
      # Screenshots de erro (erro_timeout.png / erro_geral.png) ficam
      # acessíveis fora do container, na pasta ./output
      - ./output:/app/output
      # Coloque aqui a imagem do QR code (ex.: qrcodes/qrcode.png) para
      # o decode_qr.py conseguir ler de dentro do container
      - ./qrcodes:/app/qrcodes
    networks:
      - eproc_net
    # Mantém o container rodando (ver CMD no Dockerfile) para permitir
    # `docker compose exec` e rodar os scripts manualmente
    stdin_open: true
    tty: true
    # IPC compartilhado evita problemas de memória do Chromium em
    # alguns hosts Docker (recomendação oficial do Playwright)
    ipc: host

networks:
  eproc_net:
    driver: bridge

volumes:
  mysql_data:
